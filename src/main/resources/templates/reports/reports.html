<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Разбор отчёта БКС</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        table { border-collapse: collapse; margin-top: 12px; margin-bottom: 24px; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; }
        th { background: #f2f2f2; }
        .error { color: #b00020; }
        .ok { color: #1b7f3a; font-weight: bold; }
        .fail { color: #b00020; font-weight: bold; }
    </style>
</head>
<body>
<h2>Загрузка брокерского отчёта БКС (.xls)</h2>

<form th:action="@{/ui/reports/upload}" method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept=".xls,.xlsx" required>
    <button type="submit">Разобрать</button>
</form>

<p class="error" th:if="${error}" th:text="${error}"></p>

<div th:if="${rows != null}">
    <h3 th:text="'Файл: ' + ${fileName}"></h3>

    <h4>Операции с суммой списания</h4>
    <table>
        <thead>
        <tr>
            <th>Дата</th>
            <th>Операция</th>
            <th>Сумма списания</th>
            <th>Площадка</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rows}">
            <td th:text="${r.date}"></td>
            <td th:text="${r.operation}"></td>
            <td th:text="${r.amount}"></td>
            <td th:text="${r.platform}"></td>
        </tr>
        <tr th:if="${rows.isEmpty()}">
            <td colspan="4">Операции не найдены</td>
        </tr>
        </tbody>
    </table>

    <h4>Сверка с разделом 1.3 (итоговые суммы)</h4>
    <table>
        <thead>
        <tr>
            <th>Операция</th>
            <th>Площадка</th>
            <th>Сумма по деталям</th>
            <th>Итог из раздела 1.3</th>
            <th>Статус</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${checks}">
            <td th:text="${c.operation}"></td>
            <td th:text="${c.platform}"></td>
            <td th:text="${c.detailSum}"></td>
            <td th:text="${c.totalSum}"></td>
            <td>
                <span th:if="${c.match}" class="ok">OK</span>
                <span th:unless="${c.match}" class="fail">РАСХОЖДЕНИЕ</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

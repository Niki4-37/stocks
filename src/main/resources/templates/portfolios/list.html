<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl">
<head>
    <meta charset="UTF-8">
    <title>Портфели</title>
    <th:block th:replace="~{sl/layout :: theme-script}"></th:block>
    <th:block th:replace="~{sl/layout :: assets}"></th:block>
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>
<body>

<div class="toolbar">
    <sl:button as="a" variant="outline" th:href="@{/ui/portfolios/new}">+ Создать портфель</sl:button>
</div>

<sl:card>
    <sl:card-header>
        <sl:card-title>Портфели</sl:card-title>
    </sl:card-header>

    <sl:card-content>
        <sl:table th:if="${not #lists.isEmpty(portfolios)}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Базовая валюта</th>
                    <th>Создан</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${portfolios}">
                    <td th:text="${p.id}">1</td>
                    <td><sl:badge variant="outline" th:text="${p.name}">Основной</sl:badge></td>
                    <td th:text="${p.baseCurrency}">RUB</td>
                    <td th:text="${p.createdAt}">2026-10-16</td>
                    <td>
                        <sl:button as="a" variant="outline" th:href="@{/ui/portfolios/{id}(id=${p.id})}">Перейти</sl:button>
                    </td>>
                </tr>
            </tbody>
        </sl:table>
    </sl:card-content>
</sl:card>

<sl:empty th:if="${#lists.isEmpty(portfolios)}">
    Портфелей пока нет. Создайте первый.
</sl:empty>

</body>
</html>
